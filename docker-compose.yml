version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://clipforge:clipforge@postgres:5432/clipforge
      REDIS_HOST: redis
      JWT_SECRET: change-me
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://clipforge:clipforge@postgres:5432/clipforge
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - backend
      - redis
  ai-service:
    build: ./ai-service
    environment:
      API_WEBHOOK: http://backend:4000/api/webhooks/jobs
    ports:
      - "8000:8000"
    depends_on:
      - backend
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  pgdata:
